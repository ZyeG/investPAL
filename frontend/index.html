<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvestPAL — AI Trading Analyst</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #070b14;
      --bg2:       #0c1120;
      --card:      #0f1626;
      --card2:     #131c2e;
      --border:    #1b2840;
      --border2:   #243251;
      --text:      #e2e8f0;
      --text2:     #94a3b8;
      --text3:     #4a5d7a;
      --green:     #10d9a0;
      --green-dim: #0d6e52;
      --red:       #f43f5e;
      --red-dim:   #7a1a2d;
      --amber:     #f59e0b;
      --amber-dim: #7a4e08;
      --blue:      #60a5fa;
      --blue-dim:  #1e3a5f;
      --purple:    #a78bfa;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    #app { min-height: 100vh; }
    .view { animation: fadeUp 0.3s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    @keyframes barFill { from { width:0%; } to { width:var(--to); } }
    @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }

    /* ── SHARED HEADER ──────────────────────────────────── */
    .hdr {
      position:sticky; top:0; z-index:100;
      background:rgba(7,11,20,0.94); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      height:60px; padding:0 24px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .logo { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:800; letter-spacing:-.5px; color:var(--text); text-decoration:none; cursor:pointer; }
    .logo-icon { width:32px; height:32px; background:linear-gradient(135deg,#60a5fa,#a78bfa); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; }
    .logo span { color:var(--blue); }
    .hdr-right { display:flex; align-items:center; gap:12px; }
    .hdr-search { display:flex; align-items:center; gap:8px; background:var(--card2); border:1px solid var(--border2); border-radius:10px; padding:7px 14px; min-width:200px; }
    .hdr-search input { background:none; border:none; outline:none; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; width:100%; letter-spacing:1px; }
    .hdr-search input::placeholder { color:var(--text3); font-weight:400; letter-spacing:0; }
    .hdr-btn { background:var(--blue); color:#000; font-size:12px; font-weight:700; border:none; border-radius:8px; padding:7px 14px; cursor:pointer; transition:opacity .15s; white-space:nowrap; }
    .hdr-btn:hover { opacity:.85; }
    .hdr-date { font-size:12px; color:var(--text3); font-family:'JetBrains Mono',monospace; }
    .back-btn { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text2); background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:6px 14px; cursor:pointer; transition:all .15s; }
    .back-btn:hover { color:var(--text); border-color:var(--border2); }

    /* ── HOME HERO ──────────────────────────────────────── */
    .home-hero {
      background:linear-gradient(180deg,rgba(96,165,250,0.06) 0%,rgba(7,11,20,0) 100%);
      border-bottom:1px solid var(--border);
      padding:52px 24px 40px;
      text-align:center;
    }
    .home-hero h1 { font-size:32px; font-weight:800; letter-spacing:-.8px; margin-bottom:8px; }
    .home-hero h1 span { color:var(--blue); }
    .home-hero p { font-size:14px; color:var(--text2); margin-bottom:28px; }
    .home-hero p b { color:var(--purple); font-weight:500; }
    .search-bar {
      display:flex; align-items:center; gap:0;
      max-width:560px; margin:0 auto;
      background:var(--card); border:1.5px solid var(--border2);
      border-radius:14px; overflow:hidden;
      box-shadow:0 0 40px rgba(96,165,250,0.08);
      transition:border-color .2s;
    }
    .search-bar:focus-within { border-color:var(--blue); }
    .search-bar input {
      flex:1; background:none; border:none; outline:none;
      color:var(--text); font-family:'JetBrains Mono',monospace;
      font-size:18px; font-weight:600; letter-spacing:2px;
      padding:16px 20px; text-transform:uppercase;
    }
    .search-bar input::placeholder { color:var(--text3); font-weight:400; letter-spacing:0.5px; font-size:15px; text-transform:none; }
    .search-btn {
      background:var(--blue); color:#000; font-size:14px; font-weight:700;
      border:none; padding:16px 28px; cursor:pointer; transition:opacity .15s;
      white-space:nowrap;
    }
    .search-btn:hover { opacity:.85; }
    .search-btn:disabled { opacity:.4; cursor:default; }
    .agents-badge { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; flex-wrap:wrap; }
    .agent-chip { display:inline-flex; align-items:center; gap:5px; background:var(--card2); border:1px solid var(--border); border-radius:100px; padding:4px 12px; font-size:11px; color:var(--text3); }
    .agent-chip span { font-weight:600; }

    /* ── REPORTS GRID ───────────────────────────────────── */
    .reports-section { max-width:1200px; margin:0 auto; padding:32px 24px; }
    .reports-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .reports-title { font-size:14px; font-weight:600; color:var(--text2); }
    .reports-title b { color:var(--text); }
    .reports-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
    .report-card {
      background:var(--card); border:1px solid var(--border);
      border-radius:16px; padding:20px;
      display:flex; flex-direction:column; gap:14px;
      cursor:pointer; transition:all .18s;
      position:relative; overflow:hidden;
    }
    .report-card:hover { border-color:var(--border2); transform:translateY(-2px); box-shadow:0 8px 32px rgba(0,0,0,0.4); }
    .report-card.processing { cursor:default; }
    .report-card::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,transparent 60%,rgba(96,165,250,0.04)); pointer-events:none; }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; }
    .card-ticker { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--blue); letter-spacing:.5px; }
    .card-exchange { font-size:11px; color:var(--text3); margin-top:1px; }
    .card-del { width:24px; height:24px; border:none; background:none; color:var(--text3); cursor:pointer; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; transition:all .15s; flex-shrink:0; }
    .card-del:hover { background:var(--red-dim); color:var(--red); }
    .card-company { font-size:12px; color:var(--text2); line-height:1.4; }
    .card-score-block { text-align:center; padding:4px 0; }
    .card-score-num { font-size:44px; font-weight:800; font-family:'JetBrains Mono',monospace; line-height:1; }
    .card-score-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
    .card-signal { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:700; padding:6px 14px; border-radius:8px; border:1px solid; }
    .card-signal.buy        { background:rgba(16,217,160,0.1);  color:var(--green);  border-color:var(--green-dim); }
    .card-signal.hold-plus  { background:rgba(245,158,11,0.1);  color:var(--amber);  border-color:var(--amber-dim); }
    .card-signal.hold       { background:rgba(96,165,250,0.1);  color:var(--blue);   border-color:var(--blue-dim);  }
    .card-signal.sell       { background:rgba(244,63,94,0.1);   color:var(--red);    border-color:var(--red-dim);   }
    .card-signal.avoid      { background:rgba(244,63,94,0.1);   color:var(--red);    border-color:var(--red-dim);   }
    .card-signal.strong-buy { background:rgba(16,217,160,0.1);  color:var(--green);  border-color:var(--green-dim); }
    .card-signal.processing { background:rgba(167,139,250,0.1); color:var(--purple); border-color:rgba(167,139,250,0.3); }
    .card-meta { display:flex; justify-content:space-between; font-size:11px; }
    .card-meta-price { font-family:'JetBrains Mono',monospace; font-weight:600; }
    .card-meta-date { color:var(--text3); }
    .card-status { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; }
    .status-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .status-dot.generated  { background:var(--green); }
    .status-dot.processing { background:var(--amber); animation:pulse 1.2s infinite; }
    .status-dot.failed     { background:var(--red); }
    .card-view-btn { display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; font-weight:600; color:var(--blue); padding-top:4px; border-top:1px solid var(--border); }
    .card-progress-bar { height:4px; background:var(--bg2); border-radius:2px; overflow:hidden; margin-top:2px; }
    .card-progress-fill { height:100%; background:linear-gradient(90deg,var(--purple),var(--blue)); border-radius:2px; animation:shimmer 1.5s infinite linear; background-size:200%; }

    /* ── EMPTY STATE ────────────────────────────────────── */
    .empty-state { text-align:center; padding:64px 24px; color:var(--text3); }
    .empty-state h3 { font-size:16px; font-weight:600; color:var(--text2); margin-bottom:8px; }
    .empty-state p { font-size:13px; }

    /* ── LOADING OVERLAY ────────────────────────────────── */
    .loading-overlay {
      position:fixed; inset:0; z-index:200;
      background:rgba(7,11,20,0.96); backdrop-filter:blur(8px);
      display:flex; align-items:center; justify-content:center;
      animation:fadeUp .3s ease;
    }
    .loading-box {
      background:var(--card); border:1px solid var(--border2);
      border-radius:20px; padding:36px 40px;
      width:100%; max-width:520px; margin:16px;
    }
    .loading-ticker { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; color:var(--blue); letter-spacing:2px; }
    .loading-company { font-size:13px; color:var(--text2); margin-top:2px; margin-bottom:24px; }
    .loading-stage-msg { font-size:13px; color:var(--text2); margin-bottom:20px; min-height:20px; }
    .loading-stage-msg b { color:var(--text); }
    .agent-row { display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--border); }
    .agent-row:last-of-type { border-bottom:none; }
    .agent-row-icon { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
    .agent-row-info { flex:1; min-width:0; }
    .agent-row-name { font-size:12px; font-weight:600; font-family:'JetBrains Mono',monospace; }
    .agent-row-sub { font-size:10px; color:var(--text3); margin-top:1px; }
    .agent-row-bar { height:5px; background:var(--bg2); border-radius:3px; overflow:hidden; margin-top:6px; }
    .agent-row-fill { height:100%; border-radius:3px; width:0%; transition:width .1s linear; }
    .agent-row-status { font-size:11px; font-family:'JetBrains Mono',monospace; flex-shrink:0; min-width:52px; text-align:right; }
    .spinner { width:16px; height:16px; border:2px solid var(--border2); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
    .loading-tokens { margin-top:20px; padding:12px 16px; background:var(--bg2); border-radius:10px; }
    .loading-tokens-label { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.8px; margin-bottom:4px; }
    .loading-tokens-val { font-size:18px; font-weight:700; font-family:'JetBrains Mono',monospace; color:var(--text); }
    .loading-tokens-total { font-size:11px; color:var(--text3); }
    .loading-done-msg { margin-top:20px; padding:14px 16px; background:rgba(16,217,160,0.08); border:1px solid rgba(16,217,160,0.2); border-radius:10px; font-size:13px; color:var(--green); display:none; }
    .view-report-btn { display:block; width:100%; margin-top:12px; background:var(--green); color:#000; font-size:14px; font-weight:700; border:none; border-radius:10px; padding:13px; cursor:pointer; transition:opacity .15s; display:none; }
    .view-report-btn:hover { opacity:.85; }

    /* ── REPORT VIEW ────────────────────────────────────── */
    .rpt-wrap { max-width:1400px; margin:0 auto; padding:24px; }
    .rpt-hero {
      display:grid; grid-template-columns:auto 1fr auto;
      gap:20px; align-items:center;
      background:linear-gradient(135deg,#0f1626,#131c2e);
      border:1px solid var(--border2); border-radius:16px;
      padding:24px 28px; margin-bottom:24px;
    }
    .rpt-ticker-name { font-size:34px; font-weight:800; letter-spacing:-1px; font-family:'JetBrains Mono',monospace; color:var(--blue); line-height:1; }
    .rpt-company { font-size:13px; color:var(--text2); margin-top:4px; }
    .rpt-meta-row { display:flex; gap:24px; margin-top:14px; }
    .rpt-meta-item label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.8px; display:block; }
    .rpt-meta-item span { font-size:13px; font-weight:600; font-family:'JetBrains Mono',monospace; }
    .rpt-price-block { padding-left:28px; border-left:1px solid var(--border); }
    .rpt-price-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
    .rpt-price { font-size:38px; font-weight:700; font-family:'JetBrains Mono',monospace; letter-spacing:-1px; line-height:1; }
    .badge-change { font-size:12px; font-weight:600; font-family:'JetBrains Mono',monospace; padding:3px 9px; border-radius:6px; }
    .badge-change.up   { background:rgba(16,217,160,0.15); color:var(--green); border:1px solid var(--green-dim); }
    .badge-change.down { background:rgba(244,63,94,0.15);  color:var(--red);   border:1px solid var(--red-dim); }
    .levels-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .level-chip { display:inline-flex; align-items:center; gap:5px; background:var(--card2); border:1px solid var(--border2); border-radius:7px; padding:5px 10px; font-size:11px; }
    .level-chip .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .level-chip .val { font-family:'JetBrains Mono',monospace; font-weight:600; }
    .level-chip .lbl { color:var(--text3); }
    .rpt-signal-block { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .sig-badge { font-size:20px; font-weight:800; padding:10px 22px; border-radius:12px; border:2px solid; text-align:center; }
    .sig-badge.buy        { background:rgba(16,217,160,0.1);  color:var(--green);  border-color:var(--green-dim); }
    .sig-badge.hold-plus  { background:rgba(245,158,11,0.1);  color:var(--amber);  border-color:var(--amber-dim); }
    .sig-badge.hold       { background:rgba(96,165,250,0.1);  color:var(--blue);   border-color:var(--blue-dim); }
    .sig-badge.sell       { background:rgba(244,63,94,0.1);   color:var(--red);    border-color:var(--red-dim); }
    .sig-badge.avoid      { background:rgba(244,63,94,0.1);   color:var(--red);    border-color:var(--red-dim); }
    .sig-badge.strong-buy { background:rgba(16,217,160,0.1);  color:var(--green);  border-color:var(--green-dim); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; }
    .card-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text3); margin-bottom:14px; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
    .three-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:20px; }
    .span2 { grid-column:span 2; }
    .chart-h260 { position:relative; height:260px; }
    .chart-h200 { position:relative; height:200px; }
    .chart-h300 { position:relative; height:300px; }
    .chart-h220 { position:relative; height:220px; }
    .section-label { font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:12px; }
    .mt20 { margin-top:20px; }
    .mt24 { margin-top:24px; }
    .mb20 { margin-bottom:20px; }
    .mb24 { margin-bottom:24px; }
    .agent-scores { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
    .agent-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .agent-card.composite { background:linear-gradient(135deg,rgba(96,165,250,0.07),rgba(167,139,250,0.07)); border-color:var(--border2); }
    .agent-name-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text3); text-align:center; }
    .gauge-wrap { position:relative; width:96px; height:96px; }
    .gauge-wrap canvas { width:96px !important; height:96px !important; }
    .gauge-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .gauge-num { font-size:21px; font-weight:700; font-family:'JetBrains Mono',monospace; line-height:1; }
    .gauge-denom { font-size:9px; color:var(--text3); }
    .metrics-tbl { width:100%; border-collapse:collapse; }
    .metrics-tbl tr { border-bottom:1px solid var(--border); }
    .metrics-tbl tr:last-child { border-bottom:none; }
    .metrics-tbl td { padding:8px 0; font-size:12px; }
    .metrics-tbl td:first-child { color:var(--text2); }
    .metrics-tbl td:nth-child(2) { font-family:'JetBrains Mono',monospace; font-weight:600; text-align:right; }
    .metrics-tbl td:nth-child(3) { text-align:right; padding-left:10px; }
    .pill { display:inline-flex; align-items:center; padding:2px 7px; border-radius:100px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
    .pill.g { background:rgba(16,217,160,0.13); color:var(--green); }
    .pill.r { background:rgba(244,63,94,0.13);  color:var(--red); }
    .pill.a { background:rgba(245,158,11,0.13); color:var(--amber); }
    .factors-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
    .factor-list { list-style:none; display:flex; flex-direction:column; gap:8px; }
    .factor-item { display:flex; gap:10px; padding:10px; border-radius:9px; font-size:12px; line-height:1.5; }
    .factor-item.bull { background:rgba(16,217,160,0.05); border:1px solid rgba(16,217,160,0.14); }
    .factor-item.bear { background:rgba(244,63,94,0.05);  border:1px solid rgba(244,63,94,0.14); }
    .factor-icon { font-size:13px; flex-shrink:0; margin-top:1px; }
    .factor-title { font-weight:600; color:var(--text); }
    .factor-desc  { color:var(--text2); font-size:11px; margin-top:1px; }
    .scenario-row { display:grid; grid-template-columns:72px 1fr 70px 110px; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
    .scenario-row:last-child { border-bottom:none; }
    .scenario-lbl { font-size:12px; font-weight:700; }
    .scenario-bar-bg { height:7px; background:var(--bg2); border-radius:4px; overflow:hidden; }
    .scenario-bar-fill { height:100%; border-radius:4px; }
    .scenario-pct { font-size:12px; font-family:'JetBrains Mono',monospace; font-weight:600; text-align:right; }
    .scenario-tgt { font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--text2); text-align:right; }
    .verdict { background:linear-gradient(135deg,rgba(245,158,11,0.05),rgba(96,165,250,0.05)); border:1px solid rgba(245,158,11,0.2); border-radius:16px; padding:26px; margin-bottom:24px; }
    .verdict-header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; }
    .verdict-title { font-size:18px; font-weight:800; letter-spacing:-.4px; }
    .verdict-thesis { font-size:12px; color:var(--text2); margin-top:5px; max-width:600px; line-height:1.6; }
    .verdict-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px; }
    .verdict-item label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.8px; display:block; }
    .verdict-item span { font-size:15px; font-weight:700; font-family:'JetBrains Mono',monospace; }
    .verdict-action { background:rgba(245,158,11,0.07); border:1px solid rgba(245,158,11,0.18); border-radius:9px; padding:13px 16px; font-size:12px; color:var(--text2); line-height:1.6; }
    .token-tbl { width:100%; border-collapse:collapse; }
    .token-tbl th { text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text3); padding:7px 0; border-bottom:1px solid var(--border); }
    .token-tbl td { padding:9px 0; font-size:12px; border-bottom:1px solid var(--border); }
    .token-tbl tr:last-child td { border-bottom:none; font-weight:700; }

function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return Math.abs(h);
}
function seeded(seed, min, max) {
  const r = (Math.sin(seed * 9301 + 49297) * 233280 % 1 + 1) % 1;
  return min + r * (max - min);
}
function generateReport(ticker) {
  if (PRESETS[ticker]) return { ...PRESETS[ticker], id: ticker + '-' + Date.now(), status: 'generated', analyzedAt: new Date().toISOString().slice(0,10) };

  const r = (n, a, b) => Math.round(seeded(h + n, a, b) * 10) / 10;
  const ri = (n, a, b) => Math.round(seeded(h + n, a, b));
  const score = ri(1, 35, 88);
  const signals = ['AVOID','SELL','HOLD','HOLD+','BUY','BUY','STRONG BUY'];
  const sig = score < 30 ? 'AVOID' : score < 46 ? 'SELL' : score < 61 ? 'HOLD' : score < 76 ? 'HOLD+' : score < 91 ? 'BUY' : 'STRONG BUY';

let _pendingReport = null;
let _tokenInterval = null;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ── REAL analysis via server.js ─────────────────────────────── */
const API_BASE = 'http://localhost:3737';

async function analyzeWithServer(ticker, placeholderId) {
  // Start the job
  const resp = await fetch(`${API_BASE}/api/analyze`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ ticker }),
  });
  if (!resp.ok) throw new Error(await resp.text());
  const { jobId } = await resp.json();

  // Connect to SSE progress stream
  return new Promise((resolve, reject) => {
    const es = new EventSource(`${API_BASE}/api/stream/${jobId}`);
    const agentPct = { quant:0, macro:0, sent:0 };

    _ui.msg('<b>Launching 3 agents in parallel…</b>');
    ['quant','macro','sent'].forEach(n => _ui.status(n,'<span class="spinner"></span>',''));

    es.addEventListener('status', e => {
      const { message } = JSON.parse(e.data);
      _ui.msg(`<b>${message}</b>`);
    });

    es.addEventListener('agent', e => {
      const { name, status, progress } = JSON.parse(e.data);
      if (progress !== undefined) { agentPct[name] = progress; _ui.bar(name, progress); }
      if (status === 'running') _ui.status(name,'<span class="spinner"></span>','');
      if (status === 'done')   { agentPct[name]=100; _ui.bar(name,100); _ui.status(name,'✓ Done','#10d9a0'); }
    });

    es.addEventListener('agent_tick', e => {
      const { name } = JSON.parse(e.data);
      agentPct[name] = Math.min(92, (agentPct[name]||0) + 5);
      _ui.bar(name, agentPct[name]);
      _ui.token(Object.values(agentPct).reduce((a,b)=>a+b,0)/300 * 74000);
    });

    es.addEventListener('ping', () => {
      _ui.token(Object.values(agentPct).reduce((a,b)=>a+b,0)/300 * 74000);
    });

    es.addEventListener('done', e => {
      es.close();
      const { report } = JSON.parse(e.data);
      report.id = placeholderId; report.status = 'generated';
      _ui.token(report.tokens?.total || 78000);
      ['quant','macro','sent'].forEach(n => { _ui.bar(n,100); _ui.status(n,'✓ Done','#10d9a0'); });
      _ui.msg('<b>Report generated!</b>');
      resolve(report);
    });

    es.addEventListener('error', e => {
      es.close();
      let msg = 'Analysis failed';
      try { msg = JSON.parse(e.data).message; } catch(_) {}
      reject(new Error(msg));
    });

    es.onerror = () => {
      // SSE connection dropped — fall through to reject so we use mock
      es.close();
      reject(new Error('SSE connection dropped'));
    };
  });
}

/* ── MOCK fallback (when server not running) ─────────────────── */
async function analyzeWithMock(ticker, placeholderId) {
  let targetTokens = 0;
  _tokenInterval = setInterval(() => {
    const el=document.getElementById('tokenCount');
    if(!el){ clearInterval(_tokenInterval); return; }
    if(S.loadingTokens < targetTokens){ S.loadingTokens=Math.min(targetTokens,S.loadingTokens+Math.ceil((targetTokens-S.loadingTokens)/8+180)); _ui.token(S.loadingTokens); }
  }, 80);

  _ui.msg('<b>Launching 3 agents in parallel… <span style="color:var(--amber);font-size:10px;">(demo mode — start server.js for real AI)</span></b>');
  ['quant','macro','sent'].forEach(n => _ui.status(n,'<span class="spinner"></span>',''));

  const animBar = (id, ms) => {
    const t0 = Date.now();
    const tick = () => { const p=Math.min(100,((Date.now()-t0)/ms)*100); _ui.bar(id,p); if(p<100) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };
  targetTokens = 22000; animBar('quant',2200); animBar('macro',2800); animBar('sent',3200);
  await sleep(2300); targetTokens=48000; _ui.bar('quant',100); _ui.status('quant','✓ Done','#10d9a0');
  await sleep(600);  targetTokens=74000; _ui.bar('macro',100); _ui.status('macro','✓ Done','#10d9a0');
  await sleep(500);  _ui.bar('sent',100);  _ui.status('sent','✓ Done','#10d9a0');
  _ui.msg('<b>Synthesizing results from 3 agents…</b>'); await sleep(700);
  const report = generateReport(ticker);
  report.id = placeholderId; report.status = 'generated';
  targetTokens = report.tokens.total;
  _ui.msg('<b>Generating report…</b>'); await sleep(400);
  return report;
}

/* ── MAIN entry point ────────────────────────────────────────── */
async function analyzeStock(ticker) {
  ticker = ticker.trim().toUpperCase().replace(/[^A-Z0-9.]/g,'');
  if (!ticker || ticker.length > 7) { alert('Please enter a valid ticker (e.g. AAPL, NVDA, SPY).'); return; }

  S.isAnalyzing = true;
  S.loadingTicker = ticker;
  S.loadingTokens = 0;
  _pendingReport = null;

  // Add processing placeholder to reports grid
  const placeholderId = ticker + '-' + Date.now();
  S.reports.unshift({ id:placeholderId, ticker, company:COMPANIES[ticker]||ticker+' Corp.', exchange:EXCHANGES[ticker]||'NASDAQ', type:'Stock', status:'processing', analyzedAt:new Date().toISOString().slice(0,10), scores:{composite:0}, signal:'HOLD', price:0, change:0 });
  saveReports();
  render();
  showLoadingOverlay();

  let report;
  try {
    // Try real server first
    report = await analyzeWithServer(ticker, placeholderId);
  } catch (serverErr) {
    console.info(`Server unavailable (${serverErr.message}), using demo mode.`);
    // Clear token interval from a failed server attempt
    clearInterval(_tokenInterval);
    S.loadingTokens = 0;
    try {
      report = await analyzeWithMock(ticker, placeholderId);
    } catch (mockErr) {
      S.isAnalyzing = false;
      S.reports = S.reports.filter(r => r.id !== placeholderId);
      saveReports();
      const ov = document.getElementById('loadingOverlay');
      if (ov) ov.remove();
      render();
      return;
    }
  }

  // Save report and show "View Report" button
  const idx = S.reports.findIndex(r => r.id === placeholderId);
  if (idx !== -1) { S.reports[idx] = report; saveReports(); }
  _pendingReport = report;
  _ui.done(report);
}

function dismissLoading() {
  clearInterval(_tokenInterval);
  S.isAnalyzing = false;
  const ov = document.getElementById('loadingOverlay');
  if (ov) ov.remove();
  S.reports = S.reports.filter(r => r.status !== 'processing' || (r.id && _pendingReport && r.id === _pendingReport.id));
  render();
}

                <span>0 Oversold</span><span>30</span><span>50</span><span>70</span><span>Overbought 100</span>
              </div>
              <div style="text-align:center;margin-top:8px;font-size:12px;font-weight:600;color:${r.rsi>70?'var(--red)':r.rsi>60?'var(--amber)':'var(--green)'};">RSI: ${r.rsi} — ${r.rsi>70?'Overbought territory':r.rsi>60?'Approaching overbought':'Neutral range'}</div>
            </div>
          </div>
        </div>

        <!-- GROWTH + MARGINS -->
        <div class="two-col mb24">
          <div class="card"><div class="card-title">Growth Metrics (YoY %)</div><div class="chart-h260"><canvas id="r-growth"></canvas></div></div>
          <div class="card"><div class="card-title">Profitability & Margins</div><div class="chart-h260"><canvas id="r-margin"></canvas></div></div>
        </div>

        <!-- BULL / BEAR -->
        <div class="section-label">Factor Deep-Dive</div>
        <div class="factors-grid">
          <div class="card">
            <div class="card-title" style="color:var(--green);">✅ Bull Factors (${r.bulls.length})</div>
            <ul class="factor-list">${factors(r.bulls,'bull')}</ul>
          </div>
          <div class="card">
            <div class="card-title" style="color:var(--red);">🔴 Bear Factors (${r.bears.length})</div>
            <ul class="factor-list">${factors(r.bears,'bear')}</ul>
          </div>
        </div>

        <!-- PORTFOLIO -->
        <div class="section-label mt24">Portfolio Analysis</div>
        <div class="three-col">
          <div class="card"><div class="card-title">Geographic Exposure</div><div class="chart-h260"><canvas id="r-geo"></canvas></div></div>
          <div class="card">
            <div class="card-title">Risk Metrics</div>
            <table class="metrics-tbl">
              <tr><td>Beta</td><td>${r.beta}</td><td><span class="pill ${r.beta>1.5?'a':'g'}">Near Market</span></td></tr>
              <tr><td>IV 30-Day</td><td>${r.iv30d}%</td><td><span class="pill ${r.iv30d>35?'r':'g'}">${r.iv30d>35?'Elevated':'Contained'}</span></td></tr>
              <tr><td>Max Drawdown (52W)</td><td>${r.maxDrawdown}%</td><td><span class="pill r">Tail risk</span></td></tr>
              <tr><td>Sharpe Ratio</td><td>~${r.sharpe}</td><td><span class="pill ${r.sharpe>1?'g':r.sharpe>0.6?'a':'r'}">${r.sharpe>1?'Strong':r.sharpe>0.6?'Adequate':'Weak'}</span></td></tr>
              <tr><td>SPY Correlation</td><td>~${(0.5+r.beta*0.3).toFixed(2)}</td><td><span class="pill a">Moderate</span></td></tr>
            </table>
            <div style="margin-top:16px;">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
                <div style="font-size:40px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1;color:${scoreColor(r.portfolioScore)};">${r.portfolioScore}</div>
                <div><div style="font-size:13px;font-weight:600;color:${scoreColor(r.portfolioScore)};">Portfolio Health</div><div style="font-size:11px;color:var(--text2);margin-top:3px;">Core position appropriate</div></div>
              </div>
              <div style="height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;">
                <div style="height:100%;width:${r.portfolioScore}%;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));border-radius:3px;"></div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">Income & Sizing</div>
            <table class="metrics-tbl">
              <tr><td>Dividend Yield</td><td>${r.divYield}%</td><td><span class="pill ${r.divYield>2?'g':r.divYield>0.5?'a':'r'}">${r.divYield>2?'✓ Good':r.divYield>0.5?'Low':'Minimal'}</span></td></tr>
              <tr><td>D/E Ratio</td><td>${r.de}</td><td><span class="pill ${r.de<1?'g':r.de<2?'a':'r'}">${r.de<1?'✓ Low':r.de<2?'Moderate':'High'}</span></td></tr>
              <tr><td>Current Ratio</td><td>${r.currentRatio}</td><td><span class="pill ${r.currentRatio>1.5?'g':r.currentRatio>1?'a':'r'}">${r.currentRatio>1.5?'✓ Strong':r.currentRatio>1?'OK':'⚠ Tight'}</span></td></tr>
            </table>
            <div style="margin-top:16px;">
              <div class="card-title">Suggested Position Size</div>
              ${[['3–5%','Optimal','var(--green)','var(--green-dim)'],['5–7%','Caution','var(--amber)','var(--amber-dim)'],['>7%','Over-concentration','var(--red)','var(--red-dim)']].map(([sz,lbl,c,bg])=>`
                <div style="display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:6px;">
                  <span style="color:${c};font-weight:700;min-width:38px;">${sz}</span>
                  <div style="flex:1;height:5px;background:${bg};border-radius:3px;"></div>
                  <span style="color:var(--text2);">${lbl}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>

        <!-- SCENARIOS -->
        <div class="section-label mt24">Price Target Scenarios</div>
        <div class="two-col mb24">
          <div class="card"><div class="card-title">Probability Distribution</div><div class="chart-h260"><canvas id="r-scenario"></canvas></div></div>
          <div class="card">
            <div class="card-title">Scenario Breakdown</div>
            <div class="scenario-row">
              <div class="scenario-lbl" style="color:var(--green);">🐂 Bull</div>
              <div><div class="scenario-bar-bg"><div class="scenario-bar-fill" style="width:${r.scenarios.bull.prob}%;background:var(--green);"></div></div><div style="font-size:10px;color:var(--text3);margin-top:3px;">${r.scenarios.bull.thesis}</div></div>
              <div class="scenario-pct" style="color:var(--green);">${r.scenarios.bull.prob}%</div>
              <div class="scenario-tgt">${r.scenarios.bull.target}</div>
            </div>
            <div class="scenario-row">
              <div class="scenario-lbl" style="color:var(--blue);">↔ Base</div>
              <div><div class="scenario-bar-bg"><div class="scenario-bar-fill" style="width:${r.scenarios.base.prob}%;background:var(--blue);"></div></div><div style="font-size:10px;color:var(--text3);margin-top:3px;">${r.scenarios.base.thesis}</div></div>
              <div class="scenario-pct" style="color:var(--blue);">${r.scenarios.base.prob}%</div>
              <div class="scenario-tgt">${r.scenarios.base.target}</div>
            </div>
            <div class="scenario-row">
              <div class="scenario-lbl" style="color:var(--red);">🐻 Bear</div>
              <div><div class="scenario-bar-bg"><div class="scenario-bar-fill" style="width:${r.scenarios.bear.prob}%;background:var(--red);"></div></div><div style="font-size:10px;color:var(--text3);margin-top:3px;">${r.scenarios.bear.thesis}</div></div>
              <div class="scenario-pct" style="color:var(--red);">${r.scenarios.bear.prob}%</div>
              <div class="scenario-tgt">${r.scenarios.bear.target}</div>
            </div>
            <div style="margin-top:16px;padding:14px;background:var(--card2);border:1px solid var(--border2);border-radius:9px;">
              <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;">12-Month Analyst Consensus</div>
              <div style="font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;">$${r.consensusLow.toFixed(0)}–$${r.consensusHigh.toFixed(0)}</div>
              <div style="font-size:11px;color:var(--text3);">Implies ${(((r.consensusLow/r.price)-1)*100).toFixed(1)}% to ${(((r.consensusHigh/r.price)-1)*100).toFixed(1)}% from current</div>
            </div>
          </div>
        </div>

        <!-- VERDICT -->
        <div class="verdict">
          <div class="verdict-header">
            <div>
              <div class="verdict-title">${sigEmoji(r.signal)} ${r.signal} — ${r.signal==='HOLD+'?'Cautious Accumulation':r.signal==='BUY'?'Accumulate on Strength':r.signal==='STRONG BUY'?'High Conviction':r.signal==='HOLD'?'Maintain Positions':r.signal==='SELL'?'Reduce Exposure':'Avoid New Positions'}</div>
              <div class="verdict-thesis">${r.thesis}</div>
            </div>
            <div style="text-align:center;flex-shrink:0;">
              <div style="font-size:48px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1;color:${scoreColor(sc.composite)};">${sc.composite}</div>
              <div style="font-size:11px;color:var(--text3);">Composite Score</div>
            </div>
          </div>
          <div class="verdict-grid">
            <div class="verdict-item"><label>Current Price</label><span>${priceTxt}</span></div>
            <div class="verdict-item"><label>Catalyst</label><span style="color:var(--amber);font-size:13px;">${r.catalyst||'Next Earnings'}</span></div>
            <div class="verdict-item"><label>Bull Target</label><span style="color:var(--green);">${r.scenarios.bull.target}</span></div>
            <div class="verdict-item"><label>Bear Target</label><span style="color:var(--red);">${r.scenarios.bear.target}</span></div>
            <div class="verdict-item"><label>Consensus</label><span>$${r.consensusLow.toFixed(0)}–$${r.consensusHigh.toFixed(0)}</span></div>
            <div class="verdict-item"><label>Portfolio Weight</label><span style="color:var(--green);">3–5%</span></div>
          </div>
          <div class="verdict-action">
            <strong style="color:var(--amber);">Best Action:</strong> ${r.signal==='BUY'||r.signal==='STRONG BUY'?`Accumulate at current levels. Scale in on any 3–5% dips toward $${r.support.toFixed(0)} support.`:r.signal==='HOLD+'?`Hold existing positions. New entries: scale into $${r.support.toFixed(0)}–$${(r.support*1.02).toFixed(0)} dip zone near 50-DMA. Avoid chasing near resistance $${r.resistance.toFixed(0)}.`:r.signal==='HOLD'?`Maintain current positions. No new entries at this price. Wait for a pullback to the $${r.support.toFixed(0)} zone before adding.`:`Reduce or exit existing positions. Avoid new entries. Manage risk below $${r.support.toFixed(0)}.`}
          </div>
        </div>

        <!-- TOKEN USAGE -->
        <div class="card mb24">
          <div class="card-title">Token Usage Summary</div>
          <table class="token-tbl">
            <thead><tr><th>Step</th><th>Agent</th><th>Est. Tokens</th></tr></thead>
            <tbody>
              <tr><td>Orchestration</td><td style="color:var(--text2)">Master Orchestrator</td><td>${r.tokens.orchestrator.toLocaleString()}</td></tr>
              <tr><td>Quantitative Analysis</td><td style="color:#60a5fa">quant-modeler</td><td>${r.tokens.quant.toLocaleString()}</td></tr>
              <tr><td>Macro Analysis</td><td style="color:#10d9a0">macro-economist</td><td>${r.tokens.macro.toLocaleString()}</td></tr>
              <tr><td>Sentiment Analysis</td><td style="color:#a78bfa">behavioral-psychologist</td><td>${r.tokens.sentiment.toLocaleString()}</td></tr>
              <tr><td><strong>Total</strong></td><td><strong>3 Agents + Orchestrator</strong></td><td><strong>${r.tokens.total.toLocaleString()}</strong></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <footer class="footer">
        <div class="footer-brand">Invest<span>PAL</span> — AI Trading Analyst</div>
        <div class="footer-note">Report: ${r.analyzedAt} · quant-modeler · macro-economist · behavioral-psychologist<br/>For educational & research purposes only. Not financial advice.</div>
      </footer>
    </div>`;
}

/* ── CHART INIT ─────────────────────────────────────────────── */
Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = '#1b2840';
Chart.defaults.font.family = "'Inter', sans-serif";

function makeGauge(id, score, color) {
  makeChart(id, {
    type:'doughnut',
    data:{ datasets:[{ data:[score,100-score], backgroundColor:[color,'rgba(27,40,64,0.8)'], borderWidth:0, borderRadius:[4,0] }] },
    options:{ cutout:'70%', rotation:-110, circumference:220, plugins:{ legend:{display:false}, tooltip:{enabled:false} }, animation:{duration:1000,easing:'easeOutQuart'} }
  });
}

function initCharts(r) {
  if (!r) return;
  const sc = r.scores;
  makeGauge('r-g-quant',  sc.quant,     '#60a5fa');
  makeGauge('r-g-macro',  sc.macro,     '#f59e0b');
  makeGauge('r-g-sent',   sc.sentiment, '#10d9a0');
  makeGauge('r-g-comp',   sc.composite, scoreColor(sc.composite));

  // Price chart
  const n = 65;
  const today = new Date('2026-05-27');
  const tradingDays = [];
  for (let back = n+20; back >= 0 && tradingDays.length < n; back--) {
    const d = new Date(today); d.setDate(d.getDate()-back);
    if (d.getDay()!==0 && d.getDay()!==6) tradingDays.push(d);
  }
  const labels = tradingDays.map(d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
  const start = r.priceStart || r.price * 0.82;
  const end = r.price;
  const pData = tradingDays.map((_, i) => {
    const pct = i / (n-1);
    const seed = hashStr(r.ticker + i);
    const noise = (seeded(seed, -1, 1)) * end * 0.018;
    let p = start + (end - start) * pct + noise;
    if (i === n-1) p = end;
    return parseFloat(p.toFixed(2));
  });
  const ma50D = tradingDays.map((_, i) => parseFloat((r.ma200 + (r.ma50 - r.ma200) * (i / (n-1))).toFixed(2)));
  const ma200D = tradingDays.map((_, i) => parseFloat((r.ma200 * 0.97 + r.ma200 * 0.03 * (i/(n-1))).toFixed(2)));
  ma50D[n-1] = r.ma50; ma200D[n-1] = r.ma200;

  makeChart('r-price', {
    type:'line',
    data:{ labels, datasets:[
      { label:'Price', data:pData, borderColor:'#60a5fa', borderWidth:2, pointRadius:0, pointHoverRadius:3, fill:true,
        backgroundColor: ctx => { const {ctx:c,chartArea} = ctx.chart; if(!chartArea) return 'rgba(96,165,250,0.05)'; const g=c.createLinearGradient(0,chartArea.top,0,chartArea.bottom); g.addColorStop(0,'rgba(96,165,250,0.16)'); g.addColorStop(1,'rgba(96,165,250,0)'); return g; }, tension:0.3 },
      { label:'50-DMA', data:ma50D, borderColor:'#60a5fa', borderWidth:1.5, borderDash:[6,4], pointRadius:0, fill:false, tension:0.3 },
      { label:'200-DMA', data:ma200D, borderColor:'#a78bfa', borderWidth:1.5, borderDash:[3,3], pointRadius:0, fill:false, tension:0.3 },
      { label:`Support $${r.support.toFixed(0)}`, data:tradingDays.map(()=>r.support), borderColor:'rgba(16,217,160,0.4)', borderWidth:1, borderDash:[4,4], pointRadius:0, fill:false, tension:0 },
      { label:`Resist. $${r.resistance.toFixed(0)}`, data:tradingDays.map(()=>r.resistance), borderColor:'rgba(244,63,94,0.4)', borderWidth:1, borderDash:[4,4], pointRadius:0, fill:false, tension:0 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{display:true,position:'top',labels:{usePointStyle:true,pointStyle:'line',boxWidth:22,font:{size:10}}},
        tooltip:{ callbacks:{ label: c => ` ${c.dataset.label}: $${c.parsed.y.toFixed(2)}` } } },
      scales:{ x:{grid:{color:'rgba(27,40,64,0.5)'},ticks:{maxTicksLimit:7,font:{size:9,family:"'JetBrains Mono',monospace"}}},
               y:{grid:{color:'rgba(27,40,64,0.5)'},ticks:{callback:v=>'$'+v,font:{size:9,family:"'JetBrains Mono',monospace"}}} } }
  });

  // Valuation bar
  makeChart('r-val', {
    type:'bar',
    data:{ labels:['P/E','Fwd P/E','PEG×10','P/S','EV/EBITDA'],
      datasets:[
        { label:r.ticker, data:[r.pe,r.forwardPe,r.peg*10,r.ps,r.evEbitda], backgroundColor:'rgba(96,165,250,0.7)', borderRadius:4 },
        { label:'Sector Avg', data:[r.pe*0.7,r.forwardPe*0.7,r.peg*10*0.65,r.ps*0.63,r.evEbitda*0.72], backgroundColor:'rgba(167,139,250,0.4)', borderRadius:4 },
      ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:true,position:'top',labels:{font:{size:9},boxWidth:10}} },
      scales:{ x:{grid:{display:false},ticks:{font:{size:9}}}, y:{grid:{color:'rgba(27,40,64,0.5)'},ticks:{font:{size:9}}} } }
  });

  // Growth bar
  makeChart('r-growth', {
    type:'bar',
    data:{ labels:['Rev YoY','EPS YoY','Q2 Rev','FCF Growth'],
      datasets:[{ label:'%', data:[r.revenueGrowth,r.epsGrowth,r.q2Growth,r.fcfGrowth],
        backgroundColor:['rgba(16,217,160,0.7)','rgba(16,217,160,0.7)','rgba(96,165,250,0.7)','rgba(245,158,11,0.7)'], borderRadius:6 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>` ${c.parsed.y}%`}} },
      scales:{ x:{grid:{display:false},ticks:{font:{size:10}}}, y:{grid:{color:'rgba(27,40,64,0.5)'},ticks:{callback:v=>v+'%',font:{size:9}},beginAtZero:true} } }
  });

  // Margin bar
  makeChart('r-margin', {
    type:'bar',
    data:{ labels:['Gross','Operating','Net','FCF'],
      datasets:[{ label:'%', data:[r.grossMargin,r.opMargin,r.netMargin,r.fcfMargin],
        backgroundColor:['rgba(16,217,160,0.75)','rgba(96,165,250,0.75)','rgba(167,139,250,0.75)','rgba(245,158,11,0.75)'], borderRadius:6 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>` ${c.parsed.y}%`}} },
      scales:{ x:{grid:{display:false},ticks:{font:{size:10}}}, y:{grid:{color:'rgba(27,40,64,0.5)'},ticks:{callback:v=>v+'%',font:{size:9}},beginAtZero:true,max:Math.ceil(r.grossMargin/10)*10+10} } }
  });

  // Geo doughnut
  const geo = r.geo || {us:100};
  const geoLabels = ['Americas (US)','Greater China','Europe','Japan','Rest of Asia'];
  const geoData = [geo.us||0,geo.china||0,geo.europe||0,geo.japan||0,geo.restAsia||0];
  makeChart('r-geo', {
    type:'doughnut',
    data:{ labels:geoLabels, datasets:[{ data:geoData, backgroundColor:['#60a5fa','#f43f5e','#10d9a0','#a78bfa','#f59e0b'], borderWidth:2, borderColor:'#0f1626', hoverOffset:5 }]},
    options:{ responsive:true, maintainAspectRatio:false, cutout:'58%',
      plugins:{ legend:{position:'bottom',labels:{font:{size:9},padding:8,boxWidth:10,usePointStyle:true}},
        tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed}%`}} } }
  });

  // Scenario bar
  const sc2 = r.scenarios;
  makeChart('r-scenario', {
    type:'bar',
    data:{ labels:['🐂 Bull','↔ Base','🐻 Bear'],
      datasets:[{ label:'Probability %', data:[sc2.bull.prob,sc2.base.prob,sc2.bear.prob],
        backgroundColor:['rgba(16,217,160,0.7)','rgba(96,165,250,0.7)','rgba(244,63,94,0.7)'], borderRadius:6 }]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>` ${c.parsed.x}% probability`}} },
      scales:{ x:{grid:{color:'rgba(27,40,64,0.5)'},ticks:{callback:v=>v+'%',font:{size:9}},beginAtZero:true,max:60},
               y:{grid:{display:false},ticks:{font:{size:11}}} } }
  });
}

/* ── RENDER ─────────────────────────────────────────────────── */
function render() {
  const app = document.getElementById('app');
  if (S.view === 'home')   app.innerHTML = renderHome();
  if (S.view === 'report') app.innerHTML = renderReport(S.activeReport);
  attachInputHandlers();
}

function attachInputHandlers() {
  const ms = document.getElementById('mainSearch');
  if (ms) {
    ms.addEventListener('keydown', e => { if (e.key === 'Enter') handleAnalyze(); });
    ms.focus();
  }
  const hs = document.getElementById('hdrSearchInput');
  if (hs) hs.addEventListener('keydown', e => { if (e.key === 'Enter') handleHdrAnalyze(); });
}

/* ── EVENT HANDLERS ─────────────────────────────────────────── */
function handleAnalyze() {
  const inp = document.getElementById('mainSearch');
  const t = inp ? inp.value.trim() : '';
  if (t) analyzeStock(t);
}
function handleHdrAnalyze() {
  const inp = document.getElementById('hdrSearchInput');
  const t = inp ? inp.value.trim() : '';
  if (t) { analyzeStock(t); }
}
function openReport(id) {
  const r = S.reports.find(x => x.id === id);
  if (r && r.status === 'generated') { destroyCharts(); navigate('report', r); }
}
function deleteReport(id, e) {
  e.stopPropagation();
  S.reports = S.reports.filter(r => r.id !== id);
  saveReports();
  render();
}

/* ── INIT ───────────────────────────────────────────────────── */
function init() {
  loadReports();
  render();
}
init();
</script>
</body>
</html>
